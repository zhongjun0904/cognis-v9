services:
  - type: web
    name: cognis-ai-gateway
    runtime: node
    buildCommand: echo 'No dependencies to install'
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: DAILY_REQUEST_LIMIT
        value: 120
      - key: MINUTE_REQUEST_LIMIT
        value: 30
      - key: MAX_CONCURRENT_REQUESTS
        value: 4
      - key: TRUST_PROXY
        value: 1
